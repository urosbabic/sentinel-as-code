name: Microsoft Sentinel Detection-as-Code Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'MicrosoftSentinel/**'
      - 'scripts/**'
      - '.github/workflows/sentinel-deploy.yml'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run Mode (Validate rules without publishing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  sentinel-detection-pipeline:
    name: 🚀 Sentinel Detection CI/CD
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: 🔍 Verify Target Sentinel Workspace
        shell: pwsh
        run: |
          Write-Host "Target Subscription : ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          Write-Host "Target Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          Write-Host "Target Workspace     : ${{ secrets.AZURE_WORKSPACE_NAME }}"
          az account show --output table

      - name: 📦 Install Sentinel Conversion Tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name SentinelARConverter -Scope CurrentUser -Force -AllowClobber -ErrorAction SilentlyContinue

      - name: 🛡️ Deploy Detection Rules to Microsoft Sentinel
        shell: pwsh
        run: |
          $dryRunFlag = if ("${{ inputs.dryRun }}" -eq "true") { @("-DryRun") } else { @() }

          & "${{ github.workspace }}\scripts\Deploy-SentinelAll.ps1" `
            -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" `
            -ResourceGroupName "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            -WorkspaceName "${{ secrets.AZURE_WORKSPACE_NAME }}" `
            @dryRunFlag

name: Deploy Microsoft Sentinel Content (Detection-as-Code)

on:
  push:
    branches:
      - main
    paths:
      - 'MicrosoftSentinel/**'
      - 'scripts/**'
      - '.github/workflows/sentinel-deploy.yml'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run validation only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  deploy-sentinel:
    name: Deploy Content to Microsoft Sentinel
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Install Sentinel Conversion Modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name SentinelARConverter -Scope CurrentUser -Force -AllowClobber -ErrorAction SilentlyContinue

      - name: Convert YAML Detection Rules to ARM Templates
        shell: pwsh
        run: |
          $publishPath = "${{ github.workspace }}\MicrosoftSentinel\Detections"
          if (Test-Path $publishPath) {
            $yamlFiles = Get-ChildItem -Path $publishPath -Recurse -Include *.yaml, *.yml
            Write-Host "Found $($yamlFiles.Count) YAML rule file(s) to convert..."
            foreach ($file in $yamlFiles) {
              try {
                Convert-SentinelARYamlToArm -Filename $file.FullName -UseOriginalFilename
                Write-Host "✅ Converted $($file.Name)"
                Remove-Item $file.FullName -Force
              }
              catch {
                Write-Warning "Failed to convert $($file.Name): $($_.Exception.Message)"
              }
            }
          }

      - name: Deploy Analytic Rules & Content to Microsoft Sentinel
        shell: pwsh
        run: |
          & "${{ github.workspace }}\scripts\Deploy-SentinelAll.ps1" `
            -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" `
            -ResourceGroupName "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            -WorkspaceName "${{ secrets.AZURE_WORKSPACE_NAME }}"
